<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Farm</title>
    <link rel="icon" type="image/x-icon" href="assets/ui/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Open Sans";
        }

        body {
            line-height: 1;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image: url(assets/wallpaper/wall.jpg);
            background-size: cover;
            background-position: center;

            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.5);

            z-index: -1;
        }

        header {
            background-color: green;
        }

        ol,
        ul {
            list-style: none;
        }

        img,
        video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #game-container {
            max-height: 1200px;
            max-width: 1200px;
        }

        #container {
            width: 80%;
            height: 100%;
            margin: auto 0px;
        }
    </style>
</head>

<body>

    <div id="container">

        <div id="cont"
            style="background-color: white; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
            padding: 10px 10px;">
           
            <div id="game-container"></div>
            <script src="./phaser.js"></script>
            <script type="module" src="./src/main.js"></script>

        </div>
    </div>
</body>

<script>

    function toggleBackground() {
        const div = document.getElementById("cont")
        const bg = div.style.getPropertyValue("background-color");
        bg == "black" ? div.style.setProperty("background-color", "white") : div.style.setProperty("background-color", "black")
    }

</script>

</html>
